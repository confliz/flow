<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #f3f5f8; --sheet: #fff; --ink: #151a22; --muted: #5d6675; --line: #d6dce5;
  --pro: #1f4fd8; --pro-tint: #f1f5ff; --con: #b3261e; --con-tint: #fff4f3;
  --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--font); }
h1, h2 { margin: 0; letter-spacing: -0.02em; line-height: 1.1; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.05rem; margin-bottom: .6rem; }
.muted { color: var(--muted); }
input, select, textarea, button { font: inherit; color: inherit; }
input, select { padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); min-width: 0; }
button { padding: .55rem .9rem; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); cursor: pointer; transition: transform 100ms ease-out; }
button:active { transform: scale(0.97); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
button.link { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: .3rem .5rem; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.msg { color: var(--con); margin: .6rem 0; }

.auth { max-width: 360px; margin: 12vh auto; padding: 0 1.2rem; display: grid; gap: .8rem; }
.auth label { display: grid; gap: .3rem; font-weight: 500; }
.setup { max-width: 520px; margin: 12vh auto; padding: 0 1.2rem; }

.bar { display: flex; align-items: center; gap: .9rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); background: var(--sheet); flex-wrap: wrap; }
.bar .spacer { margin-left: auto; }
.status.error { color: var(--con); font-weight: 600; }
.status.ok { color: var(--muted); }
.badge { background: var(--con); color: #fff; border-radius: 99px; font-size: .75rem; padding: 0 .45rem; margin-left: .4rem; }

.list { max-width: 720px; margin: 0 auto; padding-bottom: 3rem; }
.list .pad { padding: 0 1rem; }
.panelbox { margin-top: 1.2rem; padding: 1rem; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.row input { flex: 1 1 180px; }
.flows { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
.flowrow { width: 100%; display: flex; justify-content: space-between; gap: 1rem; text-align: left; padding: .8rem 1rem; }

/* modal (finals prompt) */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(21,26,34,.55); display: grid; place-items: center; padding: 1rem; }
.modal { background: var(--sheet); border-radius: 14px; padding: 1.5rem; width: min(420px, 100%); display: grid; gap: .9rem; }
.modal .row button { flex: 1; padding: .8rem; }

/* flow sheet */
.flowpage { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.scroller { flex: 1; overflow: auto; padding: 0 1rem 2rem; }
.grid { display: grid; grid-template-columns: repeat(8, minmax(210px, 1fr)); min-width: 1700px; background: var(--line); gap: 1px; border: 1px solid var(--line); }
.head { position: sticky; top: 0; z-index: 2; padding: .6rem .7rem; background: var(--sheet); border-top: 3px solid; }
.head.pro { border-color: var(--pro); color: var(--pro); }
.head.con { border-color: var(--con); color: var(--con); }
.addrow { margin-top: .8rem; }

.cellwrap { position: relative; display: flex; min-height: 2.4rem; background: var(--sheet); }
.cellwrap.pro { background: var(--pro-tint); }
.cellwrap.con { background: var(--con-tint); }
.cellwrap:focus-within { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 1; background: #fff; }
.hl, .cell { margin: 0; border: 0; padding: .45rem .6rem; font: inherit; line-height: 1.35; letter-spacing: normal; white-space: pre-wrap; overflow-wrap: break-word; }
.hl { position: absolute; inset: 0; color: transparent; pointer-events: none; overflow: hidden; }
.hl mark { color: transparent; border-radius: 3px; }
.cell { position: relative; flex: 1; width: 100%; min-height: 2.4rem; resize: none; overflow: hidden; background: transparent; field-sizing: content; }
.cell:focus { outline: none; }
.m-y { background: #f6ee70; } .m-r { background: #ff8f8f; } .m-b { background: #84dfff; } .m-g { background: #9ced80; }

/* highlight picker */
.picker { position: fixed; z-index: 40; display: flex; align-items: center; gap: .5rem; padding: .55rem .7rem; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(21,26,34,.18); }
.swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 1px solid rgba(21,26,34,.35); }

/* side panel */
.panel { position: fixed; right: 0; bottom: 0; width: 290px; z-index: 20; background: var(--sheet); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform 220ms cubic-bezier(.2,.8,.2,1); }
.panel.open { transform: none; }
.handle { position: absolute; left: -34px; top: 18px; width: 34px; padding: .9rem 0; writing-mode: vertical-rl; border-right: 0; border-radius: 10px 0 0 10px; touch-action: none; }
.panelbody { height: 100%; overflow-y: auto; padding: 1rem; display: grid; gap: 1.1rem; align-content: start; }
.rings { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.ringbox { display: grid; justify-items: center; gap: .35rem; text-align: center; }
.ringlabel { font-size: .85rem; color: var(--muted); }
.ring { position: relative; width: 108px; height: 108px; cursor: pointer; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.track { fill: none; stroke: var(--line); stroke-width: 8; }
.prog { fill: none; stroke: var(--ink); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 200ms linear; }
.ringbox.theirs .prog { stroke: var(--muted); }
.ring .time { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.over .prog { stroke: var(--con); } .over .time, .speechtime.over { color: var(--con); }
.ringbtns { display: flex; gap: .2rem; align-items: center; }
.ringbtns button:not(.link) { padding: .35rem .8rem; }
.speech { display: grid; gap: .5rem; }
.speechrow { display: flex; align-items: center; gap: .6rem; }
.speechtime { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4.5rem; }
.chips { display: flex; gap: .4rem; }
.chip { padding: .25rem .6rem; font-size: .85rem; }

/* mac-style window */
.mac { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--sheet); box-shadow: 0 2px 10px rgba(21,26,34,.08); }
.mactitle { display: flex; align-items: center; gap: .6rem; padding: .45rem .6rem; background: linear-gradient(#f5f6f8, #e6e9ee); border-bottom: 1px solid var(--line); font-size: .8rem; font-weight: 600; }
.dots { display: flex; gap: .3rem; }
.d { width: 10px; height: 10px; border-radius: 50%; display: block; }
.d.r { background: #ff5f57; } .d.y { background: #febc2e; } .d.g { background: #28c840; }
.mac .mt { flex: 1; text-align: center; margin-right: 2.2rem; }
.qlist { list-style: none; margin: 0; padding: .4rem; display: grid; gap: .2rem; max-height: 220px; overflow-y: auto; }
.qlist li { display: flex; align-items: flex-start; gap: .45rem; padding: .25rem .3rem; border-radius: 6px; font-size: .9rem; }
.qlist li.asked span { text-decoration: line-through; color: var(--muted); }
.qlist li span { flex: 1; overflow-wrap: anywhere; }
.qlist li button { padding: 0 .4rem; border: 0; background: none; color: var(--muted); }
.qempty { padding: .6rem .7rem; color: var(--muted); font-size: .85rem; }
.macadd { padding: .4rem; border-top: 1px solid var(--line); }
.macadd input { width: 100%; }

/* chat window */
.win { position: fixed; left: 24px; top: 120px; width: 310px; z-index: 30; background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 34px rgba(21,26,34,.22); display: flex; flex-direction: column; overflow: hidden; }
.win .titlebar { display: flex; align-items: center; justify-content: space-between; padding: .5rem .7rem; background: linear-gradient(#f5f6f8, #e6e9ee); border-bottom: 1px solid var(--line); cursor: grab; touch-action: none; user-select: none; }
.win .titlebar button { padding: 0 .5rem; border: 0; background: none; font-size: 1.1rem; line-height: 1.4; }
.chatlog { height: 260px; overflow-y: auto; padding: .7rem; display: flex; flex-direction: column; gap: .4rem; }
.bubble { max-width: 82%; padding: .4rem .65rem; border-radius: 12px; overflow-wrap: anywhere; font-size: .92rem; }
.bubble.me { align-self: flex-end; background: var(--ink); color: #fff; }
.bubble.them { align-self: flex-start; background: #eceff4; }
.chatadd { display: flex; gap: .4rem; padding: .5rem; border-top: 1px solid var(--line); }
.chatadd input { flex: 1; }

.flowitem { display: flex; gap: .4rem; }
.flowitem .flowrow { flex: 1; width: auto; min-width: 0; }
.delbtn { color: var(--muted); padding: .55rem .8rem; }
.delbtn:hover { color: var(--con); border-color: var(--con); }
button.danger { background: var(--con); color: #fff; border-color: var(--con); }

/* editable flow name (top-left of the flow page) */
.titleedit { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; padding: .15rem .35rem; border: 1px solid transparent; border-radius: 6px; background: transparent; min-width: 6ch; max-width: 50vw; }
.titleedit:hover { border-color: var(--line); }
.titleedit:focus { border-color: var(--ink); background: #fff; outline: none; }

/* folder tab + case drawer (Aff / Neg speeches) */
.cases { flex: none; background: var(--paper); }
.tabrow { display: flex; padding: 0 1rem; border-bottom: 1px solid var(--line); margin-top: .5rem; }
.foldtab { position: relative; width: 200px; height: 34px; padding: 0; border: 0; border-radius: 0; background: none; margin-bottom: -1px; font-weight: 600; font-size: .9rem; transition: none; }
.foldtab:active { transform: none; }
.foldtab svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.foldtab path { fill: var(--sheet); stroke: var(--line); stroke-width: 1; }
.foldtab:hover path { fill: #fafbfd; }
.foldtab span { position: relative; display: block; padding-top: 6px; }
.foldtab:focus-visible { outline-offset: -2px; border-radius: 10px 10px 0 0; }
.casebody { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); height: 34vh; min-height: 180px; }
.caseside { display: flex; flex-direction: column; background: var(--sheet); min-width: 0; min-height: 0; }
.caselabel { padding: .45rem .8rem; font-weight: 600; border-top: 3px solid; }
.caselabel.pro { border-color: var(--pro); color: var(--pro); }
.caselabel.con { border-color: var(--con); color: var(--con); }
.casetext { flex: 1; min-height: 0; resize: none; border: 0; border-radius: 0; padding: .3rem .8rem .8rem; line-height: 1.5; background: var(--sheet); }
.casetext:focus { outline: none; background: #fff; }
.casehint { margin-left: auto; align-self: center; font-size: .85rem; color: var(--muted); }
@media (max-width: 640px) { .casebody { grid-template-columns: 1fr; height: 46vh; } .foldtab { width: 160px; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sk { background: linear-gradient(90deg, #e6eaf0 25%, #f4f6f9 50%, #e6eaf0 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; border-radius: 8px; }
.skrow { height: 52px; }
.grid.loading .cellwrap { background: linear-gradient(90deg, #e9edf2 25%, #f5f7fa 50%, #e9edf2 75%); background-size: 200% 100%; animation: sk 1.3s linear infinite; }
.grid.loading .cell { pointer-events: none; }
@keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) {
  button, .panel, .prog { transition: none; } button:active { transform: none; }
  .sk, .grid.loading .cellwrap { animation: none; }
}
</style>
</head>
<body>
<div id="app"><main class="list" aria-busy="true">
  <p class="sr" role="status">Loading…</p>
  <header class="bar" aria-hidden="true"><span class="sk" style="width:64px;height:30px"></span><span class="sk" style="width:190px;height:16px"></span><span class="sk" style="width:86px;height:38px"></span></header>
  <div class="pad" aria-hidden="true">
    <section class="panelbox"><div class="sk" style="width:90px;height:16px;margin-bottom:.9rem"></div><div class="sk" style="height:42px"></div></section>
    <section class="panelbox"><div class="sk" style="width:170px;height:16px;margin-bottom:.9rem"></div><div class="sk" style="height:42px"></div></section>
    <div class="sk" style="width:110px;height:16px;margin:1.4rem 0 .8rem"></div>
    <div class="flows"><div class="sk skrow"></div><div class="sk skrow"></div><div class="sk skrow"></div></div>
  </div>
</main></div>
<script>
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && a.getAttribute('data-ready') !== '1') {
    a.innerHTML = '<p style="padding:1.5rem;font:16px/1.5 system-ui,sans-serif">Something failed to load: ' +
      String(e.message || 'unknown error').replace(/</g, '&lt;') +
      '<br><br>Try opening this link directly in Chrome or Safari (not inside another app), or switch between Wi-Fi and mobile data.</p>';
  }
});
</script>

<script type="module">
let createClient

// ---- Your two Supabase values (publishable key only, never the secret key) ----
const SUPABASE_URL = 'https://mrmlnycvylqymdjxxafd.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_S2eQKz1ahKO4djmRVXy8Ug_FopAaOa7'
// -------------------------------------------------------------------------------

const app = document.getElementById('app')

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v)
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v)
  }
  kids.flat().forEach(c => el.append(c))
  return el
}
function mount(...nodes) { app.setAttribute('data-ready', '1'); app.replaceChildren(...nodes) }
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

// ---------- highlight helpers (marks = [[start, end, color], ...]) ----------
function applyMark(marks, s, e, color) {
  const out = []
  for (const [ms, me, mc] of marks) {
    if (me <= s || ms >= e) { out.push([ms, me, mc]); continue }
    if (ms < s) out.push([ms, s, mc])
    if (me > e) out.push([e, me, mc])
  }
  if (color) out.push([s, e, color])
  return out.sort((a, b) => a[0] - b[0])
}
function shiftMarks(marks, oldT, newT) {
  let p = 0
  const max = Math.min(oldT.length, newT.length)
  while (p < max && oldT[p] === newT[p]) p++
  let q = 0
  while (q < max - p && oldT[oldT.length - 1 - q] === newT[newT.length - 1 - q]) q++
  const oldEnd = oldT.length - q, delta = newT.length - oldT.length
  const out = []
  for (const [s, e, c] of marks) {
    if (e <= p) out.push([s, e, c])
    else if (s >= oldEnd) out.push([s + delta, e + delta, c])
    else if (s < p && e > oldEnd) out.push([s, e + delta, c])
    else {
      if (s < p) out.push([s, p, c])
      if (e > oldEnd) out.push([oldEnd + delta, e + delta, c])
    }
  }
  return out.filter(m => m[1] > m[0])
}
function hlHTML(text, marks) {
  let html = '', i = 0
  for (const [s, e, c] of marks) {
    if (s < i || e > text.length) continue
    html += esc(text.slice(i, s)) + `<mark class="m-${c}">` + esc(text.slice(s, e)) + '</mark>'
    i = e
  }
  return html + esc(text.slice(i))
}

async function loadLib() {
  const sources = [
    'https://esm.sh/@supabase/supabase-js@2.45.4',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm',
    'https://cdn.skypack.dev/@supabase/supabase-js@2.45.4'
  ]
  for (const url of sources) {
    try { createClient = (await import(url)).createClient; return true } catch (err) { console.error(err) }
  }
  mount(h('main', { class: 'setup' },
    h('h1', {}, "Couldn't load the app"),
    h('p', {}, 'Your network or browser is blocking a required library. Try mobile data instead of Wi-Fi, or open the link directly in Chrome or Safari.')))
  return false
}

loadLib().then(ok => { if (ok) start() })

function start() {
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  let leaveGrid = null
  let currentUser = undefined

  // Only react to a real sign-in / sign-out, not token refreshes or tab refocus.
  sb.auth.onAuthStateChange((_e, session) => {
    const uid = session?.user?.id ?? null
    if (uid === currentUser) return
    currentUser = uid
    if (leaveGrid) { leaveGrid(); leaveGrid = null }
    session ? showList(session) : showAuth()
  })

  // ---------- Auth (email only) ----------
  function showAuth() {
    let mode = 'in'
    const email = h('input', { type: 'email', autocomplete: 'email' })
    const password = h('input', { type: 'password', autocomplete: 'current-password' })
    const msg = h('p', { class: 'msg', role: 'status' })
    const go = h('button', { class: 'primary' }, 'Sign in')
    const toggle = h('button', { class: 'link' }, 'New here? Create an account')

    async function submit() {
      go.disabled = true; msg.textContent = ''
      const creds = { email: email.value, password: password.value }
      const { error } = mode === 'in'
        ? await sb.auth.signInWithPassword(creds)
        : await sb.auth.signUp(creds)
      if (error) msg.textContent = error.message
      go.disabled = false
    }
    go.onclick = submit
    password.addEventListener('keydown', e => e.key === 'Enter' && submit())
    toggle.onclick = () => {
      mode = mode === 'in' ? 'up' : 'in'
      go.textContent = mode === 'in' ? 'Sign in' : 'Create account'
      toggle.textContent = mode === 'in' ? 'New here? Create an account' : 'Have an account? Sign in'
      password.autocomplete = mode === 'in' ? 'current-password' : 'new-password'
      msg.textContent = ''
    }

    mount(h('main', { class: 'auth' },
      h('h1', {}, 'Flow'),
      h('p', { class: 'muted' }, 'Shared flow sheets for you and your partner.'),
      h('label', {}, 'Email', email),
      h('label', {}, 'Password', password),
      go, msg, toggle))
  }

  // ---------- Flow list ----------
  async function showList(session) {
    const uid = session.user.id
    const msg = h('p', { class: 'msg', role: 'status' })
    const flowsUl = h('ul', { class: 'flows' }, [0, 1, 2].map(() => h('li', { class: 'sk skrow', 'aria-hidden': 'true' })))
    const empty = h('p', { class: 'muted', hidden: true }, 'No flows yet. Start one above.')

    const title = h('input', { placeholder: 'Opponent or tournament' })
    const round = h('select', {}, ['Round 1', 'Round 2', 'Round 3', 'Finals'].map(r => h('option', {}, r)))
    const side = h('select', {}, h('option', { value: 'pro' }, 'We are Pro'), h('option', { value: 'con' }, 'We are Con'))
    const create = h('button', { class: 'primary' }, 'Start flow')
    create.onclick = async () => {
      msg.textContent = ''
      const { data, error } = await sb.from('flows')
        .insert({ title: title.value.trim() || 'Untitled round', round: round.value, side: side.value })
        .select().single()
      if (error) msg.textContent = error.message
      else showGrid(data, uid)
    }

    const code = h('input', { placeholder: '6-character code', maxlength: 6 })
    const join = h('button', {}, 'Join')
    join.disabled = true
    code.addEventListener('input', () => { join.disabled = code.value.trim().length < 6 })
    join.onclick = async () => {
      msg.textContent = ''
      const { data: id, error } = await sb.rpc('join_flow', { code: code.value })
      if (error) return (msg.textContent = error.message)
      const { data, error: e2 } = await sb.from('flows').select('*').eq('id', id).single()
      if (e2) msg.textContent = e2.message
      else showGrid(data, uid)
    }

    const signOut = h('button', {}, 'Sign out')
    signOut.onclick = () => sb.auth.signOut()

    mount(h('main', { class: 'list' },
      h('header', { class: 'bar' }, h('h1', {}, 'Flow'), h('span', { class: 'muted' }, session.user.email), signOut),
      h('div', { class: 'pad' },
        h('section', { class: 'panelbox' }, h('h2', {}, 'New flow'), h('div', { class: 'row' }, title, round, side, create)),
        h('section', { class: 'panelbox' }, h('h2', {}, "Join your partner's flow"), h('div', { class: 'row' }, code, join)),
        msg,
        h('section', {}, h('h2', {}, 'Your flows'), empty, flowsUl))))

    const { data, error } = await sb.from('flows').select('*').order('created_at', { ascending: false })
    flowsUl.replaceChildren()
    if (error) return (msg.textContent = error.message)
    empty.hidden = data.length > 0
    function confirmDelete(f, li) {
      const note = h('p', { class: 'msg', role: 'status' })
      const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' })
      const overlay = h('div', { class: 'modal-back', onmousedown: e => { if (e.target === overlay) close() } }, box)
      const onKey = e => { if (e.key === 'Escape') close() }
      function close() { document.removeEventListener('keydown', onKey); overlay.remove() }
      document.addEventListener('keydown', onKey)
      const yes = h('button', { class: 'danger' }, 'Delete flow')
      yes.onclick = async () => {
        yes.disabled = true; note.textContent = ''
        const { data: gone, error } = await sb.from('flows').delete().eq('id', f.id).select()
        if (error) { yes.disabled = false; return (note.textContent = error.message) }
        if (!gone || !gone.length) {
          yes.disabled = false
          return (note.textContent = "Couldn't delete. Your database rules don't allow it yet. Run the flow-delete.sql update in Supabase.")
        }
        try { localStorage.removeItem(`flow-case:${f.id}:aff`); localStorage.removeItem(`flow-case:${f.id}:neg`) } catch {}
        li.remove(); empty.hidden = flowsUl.children.length > 0
        close()
      }
      box.append(
        h('h2', {}, 'Delete this flow?'),
        h('p', {}, `"${f.title}" (${f.round}) and everything in it will be deleted, including the cells, chat and questions. If your partner joined it, it disappears for them too. This can't be undone.`),
        h('div', { class: 'row' }, h('button', { onclick: close }, 'Cancel'), yes),
        note)
      document.body.append(overlay)
    }
    data.forEach(f => {
      const b = h('button', { class: 'flowrow' },
        h('strong', {}, f.title),
        h('span', { class: 'muted' }, `${f.round} · ${f.side === 'pro' ? 'Pro' : 'Con'}`))
      b.onclick = () => showGrid(f, uid)
      const li = h('li', { class: 'flowitem' }, b)
      li.append(h('button', { class: 'delbtn', 'aria-label': `Delete ${f.title}`, onclick: () => confirmDelete(f, li) }, 'Delete'))
      flowsUl.append(li)
    })

    // Finals prompt: stays until answered, even across sessions.
    const pending = data.find(f => f.round === 'Round 3' && !f.finals_answer)
    if (pending) finalsModal(pending, session)
  }

  function finalsModal(flow, session) {
    const uid = session.user.id
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' })
    const overlay = h('div', { class: 'modal-back' }, box)
    document.body.append(overlay)
    const note = h('p', { class: 'msg', role: 'status' })

    function stepAsk() {
      box.replaceChildren(
        h('h2', {}, 'Did you make finals?'),
        h('p', { class: 'muted' }, `${flow.title} · Round 3`),
        h('div', { class: 'row' },
          h('button', { class: 'primary', onclick: stepSide }, 'Yes, we made finals'),
          h('button', { onclick: answerNo }, 'No')),
        note)
    }
    function stepSide() {
      note.textContent = ''
      box.replaceChildren(
        h('h2', {}, 'Which side are you in finals?'),
        h('div', { class: 'row' },
          h('button', { class: 'primary', onclick: () => makeFinals('pro') }, 'Pro'),
          h('button', { class: 'primary', onclick: () => makeFinals('con') }, 'Con')),
        note)
    }
    async function makeFinals(side) {
      const { data, error } = await sb.rpc('create_finals_flow', { src: flow.id, new_side: side })
      if (error) return (note.textContent = error.message)
      overlay.remove()
      showGrid(data, uid)
    }
    async function answerNo() {
      const { error } = await sb.from('flows').update({ finals_answer: 'no' }).eq('id', flow.id)
      if (error) return (note.textContent = error.message)
      box.replaceChildren(
        h('h2', {}, 'Tough break.'),
        h('p', {}, 'You put in the work. Rest up and good luck at the next tournament.'),
        h('button', { class: 'primary', onclick: () => { overlay.remove(); showList(session) } }, 'Thanks'))
    }
    stepAsk()
  }

  // ---------- Flow grid ----------
  // Pro always speaks first in CHSSA Public Forum.
  const SPEECHES = [
    ['Pro', 'Constructive'], ['Con', 'Constructive'],
    ['Pro', 'Rebuttal'], ['Con', 'Rebuttal'],
    ['Pro', 'Summary'], ['Con', 'Summary'],
    ['Pro', 'Final Focus'], ['Con', 'Final Focus']
  ]
  const MIN_ROWS = 14, SAVE_DELAY = 250
  const COLORS = { y: ['#f6ee70', 'yellow'], r: ['#ff8f8f', 'red'], b: ['#84dfff', 'blue'], g: ['#9ced80', 'green'] }
  const RING_C = 2 * Math.PI * 44

  function fmt(ms) {
    const neg = ms <= -1000
    const sec = Math.max(0, neg ? Math.floor(-ms / 1000) : Math.ceil(ms / 1000))
    return `${neg ? '-' : ''}${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`
  }

  async function showGrid(flow, userId) {
    const cellData = {}   // "col:row" -> { text, marks }
    const els = {}        // "col:row" -> { ta, back }
    const pending = {}    // key -> true while a save is waiting
    const timers = {}
    let rowCount = 0
    let channel = null
    let tick = null
    let unread = 0
    const seenMsgs = new Set()
    const questions = new Map()
    const caseTA = {}, casePend = { aff: false, neg: false }, caseFails = { aff: 0, neg: 0 }, caseTimers = {}
    let caseShared = false
    const inflight = new Set()

    // ----- status + saving -----
    const status = h('span', { class: 'status ok', role: 'status' }, 'Loading…')
    function setStatus(kind) {
      status.className = 'status ' + (kind === 'error' ? 'error' : 'ok')
      status.textContent = { loading: 'Loading…', saved: 'Synced', saving: 'Saving…', error: 'Not saving — check connection' }[kind]
    }
    const anyPending = () => Object.keys(pending).length > 0 || casePend.aff || casePend.neg
    function track(p) { inflight.add(p); p.finally(() => inflight.delete(p)); return p }
    function save(key) {
      const [col, row] = key.split(':').map(Number)
      const { text, marks } = cellData[key]
      return sb.from('cells').upsert({
        flow_id: flow.id, col, row, text, marks, updated_by: userId, updated_at: new Date().toISOString()
      })
    }
    function run(key) {
      clearTimeout(timers[key])
      delete pending[key]
      const p = Promise.resolve(save(key)).catch(() => ({ error: true })).then(({ error }) => {
        if (error) { pending[key] = true; timers[key] = setTimeout(() => run(key), 3000); setStatus('error') }
        else setStatus(anyPending() ? 'saving' : 'saved')
      })
      return track(p)
    }
    function queueSave(key) {
      pending[key] = true
      setStatus('saving')
      clearTimeout(timers[key])
      timers[key] = setTimeout(() => run(key), SAVE_DELAY)
    }
    // Starts every waiting save and resolves once all saves in flight have finished.
    function flushAll() {
      const jobs = Object.keys(pending).map(k => run(k))
      for (const side of ['aff', 'neg']) if (casePend[side]) jobs.push(runCase(side))
      return Promise.all([...jobs, ...inflight])
    }

    // ----- grid -----
    const grid = h('div', { class: 'grid' },
      SPEECHES.map(([s, n]) => h('div', { class: 'head ' + s.toLowerCase() }, h('strong', {}, s), ' ' + n)))
    grid.classList.add('loading')
    const fieldSizing = window.CSS && CSS.supports && CSS.supports('field-sizing', 'content')
    const autosize = ta => { if (!fieldSizing) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px' } }

    function renderCell(key) {
      const { ta, back } = els[key]
      back.innerHTML = hlHTML(cellData[key].text, cellData[key].marks) + '\n'
      autosize(ta)
    }
    function setCell(key, text, marks) {
      cellData[key] = { text, marks }
      els[key].ta.value = text
      renderCell(key)
    }
    function onInput(key) {
      const old = cellData[key]
      const text = els[key].ta.value
      cellData[key] = { text, marks: shiftMarks(old.marks, old.text, text) }
      renderCell(key)
      hidePicker()
      queueSave(key)
    }
    function ensureRows(n) {
      for (; rowCount < n; rowCount++) {
        SPEECHES.forEach(([side, name], c) => {
          const key = `${c}:${rowCount}`
          const back = h('div', { class: 'hl', 'aria-hidden': 'true' })
          const ta = h('textarea', { class: 'cell', rows: 1, 'aria-label': `${side} ${name}, row ${rowCount + 1}` })
          els[key] = { ta, back }
          cellData[key] = { text: '', marks: [] }
          ta.addEventListener('input', () => onInput(key))
          ta.addEventListener('mouseup', ev => pickerFor(key, ev))
          ta.addEventListener('keyup', ev => { if (ev.shiftKey || ev.key.startsWith('Arrow')) pickerFor(key, null) })
          ta.addEventListener('scroll', () => { back.scrollTop = ta.scrollTop })
          grid.append(h('div', { class: 'cellwrap ' + side.toLowerCase() }, back, ta))
        })
      }
    }

    // ----- highlight picker -----
    let pickState = null
    const picker = h('div', { class: 'picker', hidden: true, onmousedown: e => e.preventDefault() },
      Object.entries(COLORS).map(([k, [col, name]]) =>
        h('button', { class: 'swatch', style: `background:${col}`, 'aria-label': 'Highlight ' + name, onclick: () => applyColor(k) })),
      h('button', { class: 'link', onclick: () => applyColor(null) }, 'Clear'))
    function pickerFor(key, ev) {
      const ta = els[key].ta
      const s = ta.selectionStart, e = ta.selectionEnd
      if (s === e) return hidePicker()
      const r = ta.getBoundingClientRect()
      const x = ev ? ev.clientX : r.left + 24
      const y = ev ? ev.clientY : r.top + 24
      pickState = { key, s, e }
      picker.hidden = false
      const w = picker.offsetWidth || 190
      picker.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'
      picker.style.top = Math.max(8, y - 58) + 'px'
    }
    function hidePicker() { picker.hidden = true; pickState = null }
    function applyColor(color) {
      if (!pickState) return
      const { key, s, e } = pickState
      cellData[key].marks = applyMark(cellData[key].marks, s, e, color)
      renderCell(key)
      queueSave(key)
    }

    // ----- timers (shared live between partners) -----
    const TIMERS = {
      mine:   { total: 180000, left: 180000, running: false, t0: 0 },
      theirs: { total: 180000, left: 180000, running: false, t0: 0 },
      speech: { total: 240000, left: 240000, running: false, t0: 0 }
    }
    const remaining = t => t.running ? t.left - (Date.now() - t.t0) : t.left
    function sendTimer(key) {
      if (!channel) return
      const t = TIMERS[key]
      channel.send({ type: 'broadcast', event: 'timer', payload: { key, left: remaining(t), running: t.running, total: t.total } })
    }
    function toggleTimer(key) {
      const t = TIMERS[key]
      t.left = remaining(t)
      t.running = !t.running
      t.t0 = Date.now()
      sendTimer(key); updateTimers()
    }
    function resetTimer(key, total) {
      const t = TIMERS[key]
      if ((t.running || remaining(t) < t.total) && !confirm('Reset this timer for you and your partner?')) return
      if (total) t.total = total
      t.left = t.total; t.running = false
      sendTimer(key); updateTimers()
    }
    function applyTimer(p) {
      const t = TIMERS[p.key]
      if (!t) return
      t.total = p.total; t.left = p.left; t.running = p.running; t.t0 = Date.now()
      updateTimers()
    }

    const refs = {}
    function ringBox(key, label) {
      const time = h('div', { class: 'time' })
      const ring = h('div', { class: 'ring', title: 'Click to start or pause', onclick: () => toggleTimer(key) })
      ring.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="prog" cx="50" cy="50" r="44" stroke-dasharray="${RING_C}"/></svg>`
      ring.append(time)
      const startBtn = h('button', { onclick: () => toggleTimer(key) }, 'Start')
      const box = h('div', { class: 'ringbox ' + key },
        h('div', { class: 'ringlabel' }, label), ring,
        h('div', { class: 'ringbtns' }, startBtn, h('button', { class: 'link', onclick: () => resetTimer(key) }, 'Reset')))
      refs[key] = { box, time, prog: ring.querySelector('.prog'), startBtn }
      return box
    }
    const speechTime = h('div', { class: 'speechtime' })
    const speechBtn = h('button', { onclick: () => toggleTimer('speech') }, 'Start')
    const speechBox = h('div', { class: 'speech' },
      h('div', { class: 'ringlabel' }, 'Speech timer'),
      h('div', { class: 'speechrow' }, speechTime, speechBtn, h('button', { class: 'link', onclick: () => resetTimer('speech') }, 'Reset')),
      h('div', { class: 'chips' }, [240000, 180000, 120000].map(ms =>
        h('button', { class: 'chip', onclick: () => resetTimer('speech', ms) }, fmt(ms)))))
    function updateTimers() {
      for (const key of ['mine', 'theirs']) {
        const t = TIMERS[key], ms = remaining(t), r = refs[key]
        r.time.textContent = fmt(ms)
        r.prog.style.strokeDashoffset = RING_C * (1 - Math.max(0, Math.min(1, ms / t.total)))
        r.box.classList.toggle('over', ms <= -1000)
        r.startBtn.textContent = t.running ? 'Pause' : 'Start'
      }
      const s = TIMERS.speech, ms = remaining(s)
      speechTime.textContent = fmt(ms)
      speechTime.classList.toggle('over', ms <= -1000)
      speechBtn.textContent = s.running ? 'Pause' : 'Start'
    }

    // ----- crossfire questions (mac-style window) -----
    const qList = h('ul', { class: 'qlist' })
    const qInput = h('input', { placeholder: 'Add a question and press Enter', maxlength: 500 })
    function renderQs() {
      const rows = [...questions.values()].sort((a, b) => a.created_at.localeCompare(b.created_at))
      if (!rows.length) return qList.replaceChildren(h('li', { class: 'qempty' }, 'No questions yet.'))
      qList.replaceChildren(...rows.map(q => {
        const cb = h('input', { type: 'checkbox', 'aria-label': 'Asked' })
        cb.checked = q.asked
        cb.onchange = async () => {
          const { data, error } = await sb.from('questions').update({ asked: cb.checked }).eq('id', q.id).select().single()
          if (error) return setStatus('error')
          questions.set(q.id, data); renderQs()
        }
        const del = h('button', { 'aria-label': 'Delete question', onclick: async () => {
          const { error } = await sb.from('questions').delete().eq('id', q.id)
          if (error) return setStatus('error')
          questions.delete(q.id); renderQs()
        } }, '✕')
        return h('li', { class: q.asked ? 'asked' : '' }, cb, h('span', {}, q.text), del)
      }))
    }
    qInput.addEventListener('keydown', async e => {
      if (e.key !== 'Enter' || !qInput.value.trim()) return
      const text = qInput.value.trim()
      qInput.value = ''
      const { data, error } = await sb.from('questions').insert({ flow_id: flow.id, text }).select().single()
      if (error) { qInput.value = text; return setStatus('error') }
      questions.set(data.id, data); renderQs()
    })
    const mac = h('section', { class: 'mac' },
      h('div', { class: 'mactitle' },
        h('span', { class: 'dots' }, h('i', { class: 'd r' }), h('i', { class: 'd y' }), h('i', { class: 'd g' })),
        h('span', { class: 'mt' }, 'Crossfire questions')),
      qList, h('div', { class: 'macadd' }, qInput))

    // ----- side panel (pull it out) -----
    const W = 290
    let open = false
    const handle = h('button', { class: 'handle', 'aria-label': 'Pull out timers and crossfire' }, 'Timers')
    const panel = h('aside', { class: 'panel', 'aria-label': 'Timers and crossfire' }, handle,
      h('div', { class: 'panelbody' },
        h('h2', {}, 'Prep time'),
        h('div', { class: 'rings' }, ringBox('mine', 'Your time left'), ringBox('theirs', 'Opponent time left')),
        speechBox, mac))
    function setOpen(v) { open = v; panel.style.transform = ''; panel.classList.toggle('open', v) }
    handle.addEventListener('click', e => { if (e.detail === 0) setOpen(!open) }) // keyboard
    handle.addEventListener('pointerdown', e => {
      handle.setPointerCapture(e.pointerId)
      const startX = e.clientX, base = open ? 0 : W
      let moved = false
      const clamp = x => Math.min(W, Math.max(0, x))
      const move = ev => {
        const dx = ev.clientX - startX
        if (Math.abs(dx) > 4) moved = true
        if (moved) { panel.style.transition = 'none'; panel.style.transform = `translateX(${clamp(base + dx)}px)` }
      }
      const up = ev => {
        handle.removeEventListener('pointermove', move)
        handle.removeEventListener('pointerup', up)
        panel.style.transition = ''
        if (!moved) return setOpen(!open)
        setOpen(clamp(base + ev.clientX - startX) < W / 2)
      }
      handle.addEventListener('pointermove', move)
      handle.addEventListener('pointerup', up)
    })

    // ----- chat (draggable popup) -----
    const chatLog = h('div', { class: 'chatlog' })
    const chatInput = h('input', { placeholder: 'Message your partner', maxlength: 2000 })
    const badge = h('span', { class: 'badge', hidden: true })
    const chatWin = h('section', { class: 'win', hidden: true, 'aria-label': 'Chat' })
    const chatBar = h('div', { class: 'titlebar' }, h('strong', {}, 'Chat'),
      h('button', { 'aria-label': 'Close chat', onclick: () => toggleChat() }, '✕'))
    chatWin.append(chatBar, chatLog, h('div', { class: 'chatadd' }, chatInput,
      h('button', { class: 'primary', onclick: () => sendMsg() }, 'Send')))
    chatBar.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return
      chatBar.setPointerCapture(e.pointerId)
      const r = chatWin.getBoundingClientRect()
      const dx = e.clientX - r.left, dy = e.clientY - r.top
      const move = ev => {
        chatWin.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - dx)) + 'px'
        chatWin.style.top = Math.max(0, Math.min(innerHeight - 40, ev.clientY - dy)) + 'px'
      }
      const up = () => { chatBar.removeEventListener('pointermove', move); chatBar.removeEventListener('pointerup', up) }
      chatBar.addEventListener('pointermove', move)
      chatBar.addEventListener('pointerup', up)
    })
    function toggleChat() {
      chatWin.hidden = !chatWin.hidden
      if (!chatWin.hidden) { unread = 0; badge.hidden = true; chatInput.focus(); chatLog.scrollTop = chatLog.scrollHeight }
    }
    function addMsg(m, live) {
      if (seenMsgs.has(m.id)) return
      seenMsgs.add(m.id)
      chatLog.append(h('div', { class: 'bubble ' + (m.user_id === userId ? 'me' : 'them') }, m.text))
      chatLog.scrollTop = chatLog.scrollHeight
      if (live && m.user_id !== userId && chatWin.hidden) { unread++; badge.textContent = unread; badge.hidden = false }
    }
    async function sendMsg() {
      const text = chatInput.value.trim()
      if (!text) return
      chatInput.value = ''
      const { data, error } = await sb.from('messages').insert({ flow_id: flow.id, text }).select().single()
      if (error) { chatInput.value = text; return setStatus('error') }
      addMsg(data, false)
    }
    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg() })

    // ----- export to PDF (opens the print dialog; choose "Save as PDF") -----
    function exportPDF() {
      flushAll()
      const filled = Object.keys(cellData).filter(k => cellData[k].text.trim())
      const lastRow = filled.reduce((m, k) => Math.max(m, Number(k.split(':')[1]) + 1), 0)
      let body = ''
      for (let r = 0; r < lastRow; r++) {
        body += '<tr>' + SPEECHES.map((_, c) => {
          const d = cellData[`${c}:${r}`]
          return `<td>${d ? hlHTML(d.text, d.marks) : ''}</td>`
        }).join('') + '</tr>'
      }
      const heads = SPEECHES.map(([s, n]) => `<th class="${s.toLowerCase()}">${s} ${n}</th>`).join('')
      const qs = [...questions.values()].sort((a, b) => a.created_at.localeCompare(b.created_at))
      const qHtml = qs.length
        ? `<h2>Crossfire questions</h2><ol>${qs.map(q => `<li>${esc(q.text)}${q.asked ? ' (asked)' : ''}</li>`).join('')}</ol>` : ''
      const doc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(flow.title)}</title><style>
        @page { size: landscape; margin: 10mm; }
        body { font: 9pt/1.35 system-ui, sans-serif; color: #151a22; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        h1 { font-size: 14pt; margin: 0 0 2mm; } p { margin: 0 0 4mm; color: #5d6675; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid #c9d0db; padding: 2mm; vertical-align: top; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
        th.pro { border-top: 2px solid #1f4fd8; color: #1f4fd8; } th.con { border-top: 2px solid #b3261e; color: #b3261e; }
        tr { break-inside: avoid; }
        .m-y { background: #f6ee70; } .m-r { background: #ff8f8f; } .m-b { background: #84dfff; } .m-g { background: #9ced80; }
        h2 { font-size: 11pt; margin: 6mm 0 2mm; }
      </style></head><body><h1>${esc(flow.title)}</h1><p>${esc(flow.round)} · ${flow.side === 'pro' ? 'Pro' : 'Con'}</p>
      <table><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table>${qHtml}</body></html>`
        .replace(/<mark class="(m-[yrbg])">/g, '<span class="$1">').replace(/<\/mark>/g, '</span>')
      const f = document.createElement('iframe')
      f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'
      document.body.append(f)
      f.contentDocument.open(); f.contentDocument.write(doc); f.contentDocument.close()
      setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 1500) }, 250)
    }

    // ----- editable flow name -----
    const sizeTitle = () => { titleEl.style.width = Math.max(6, titleEl.value.length + 1) + 'ch' }
    const titleEl = h('input', { class: 'titleedit', value: flow.title, maxlength: 80, 'aria-label': 'Flow name', title: 'Click to rename' })
    sizeTitle()
    titleEl.addEventListener('input', sizeTitle)
    titleEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') titleEl.blur()
      if (e.key === 'Escape') { titleEl.value = flow.title; sizeTitle(); titleEl.blur() }
    })
    titleEl.addEventListener('blur', async () => {
      const t = titleEl.value.trim()
      if (!t || t === flow.title) { titleEl.value = flow.title; return sizeTitle() }
      setStatus('saving')
      const { error } = await sb.from('flows').update({ title: t }).eq('id', flow.id)
      if (error) { titleEl.value = flow.title; sizeTitle(); return setStatus('error') }
      flow.title = t; titleEl.value = t; sizeTitle(); setStatus('saved')
    })

    // ----- Aff / Neg speeches: shared through the flow row, with a backup copy on this device -----
    const caseKey = side => `flow-case:${flow.id}:${side}`
    const readCase = side => { try { return localStorage.getItem(caseKey(side)) || '' } catch { return '' } }
    const backupCase = side => { try { localStorage.setItem(caseKey(side), caseTA[side].value) } catch {} }
    const caseHint = h('span', { class: 'casehint', hidden: true })
    function setCaseHint() { caseHint.textContent = caseShared ? 'Shared with your partner' : 'Saved on this device only' }
    function queueCase(side) {
      casePend[side] = true
      setStatus('saving')
      clearTimeout(caseTimers[side])
      caseTimers[side] = setTimeout(() => runCase(side), 600)
    }
    function runCase(side) {
      clearTimeout(caseTimers[side])
      casePend[side] = false
      const p = Promise.resolve(sb.from('flows').update({ [side + '_text']: caseTA[side].value }).eq('id', flow.id).select('id'))
        .catch(() => ({ error: true }))
        .then(({ data, error }) => {
          if (error || !data || !data.length) {
            setStatus('error')
            if (++caseFails[side] < 3) { casePend[side] = true; caseTimers[side] = setTimeout(() => runCase(side), 3000) }
            else { caseShared = false; setCaseHint() }
          } else {
            caseFails[side] = 0
            setStatus(anyPending() ? 'saving' : 'saved')
          }
        })
      return track(p)
    }
    function caseBox(side, label, cls) {
      const ta = h('textarea', { class: 'casetext', placeholder: `Paste or write the ${label} speech here`, 'aria-label': `${label} speech` })
      ta.value = readCase(side)
      caseTA[side] = ta
      ta.addEventListener('input', () => { backupCase(side); if (caseShared) queueCase(side) })
      ta.addEventListener('blur', () => { if (casePend[side]) runCase(side) })
      return h('div', { class: 'caseside' }, h('div', { class: 'caselabel ' + cls }, label), ta)
    }
    const caseBody = h('div', { class: 'casebody', hidden: true }, caseBox('aff', 'Aff', 'pro'), caseBox('neg', 'Neg', 'con'))
    const foldTab = h('button', { class: 'foldtab', 'aria-expanded': 'false', 'aria-label': 'Aff and Neg speeches' })
    foldTab.innerHTML = '<svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 33.5H7Q13 33.5 16 27L22 9Q24.5 1.5 32 1.5H168Q175.5 1.5 178 9L184 27Q187 33.5 193 33.5H200"/></svg><span>Aff / Neg</span>'
    foldTab.onclick = () => {
      const show = caseBody.hidden
      caseBody.hidden = !show
      caseHint.hidden = !show
      setCaseHint()
      foldTab.setAttribute('aria-expanded', String(show))
    }
    const cases = h('section', { class: 'cases', 'aria-label': 'Aff and Neg speeches' }, h('div', { class: 'tabrow' }, foldTab, caseHint), caseBody)

    // ----- page shell -----
    const back = h('button', {}, 'Back')
    back.onclick = async () => {
      back.disabled = true; setStatus('saving')
      await flushAll()
      if (anyPending() && !confirm("Some edits haven't saved yet. Leave anyway?")) { back.disabled = false; setStatus('error'); return }
      leave(); leaveGrid = null
      const { data } = await sb.auth.getSession()
      data.session ? showList(data.session) : showAuth()
    }
    const bar = h('header', { class: 'bar' },
      back, titleEl,
      h('span', { class: 'muted' }, `${flow.round} · We are ${flow.side === 'pro' ? 'Pro' : 'Con'}`),
      h('button', { onclick: () => toggleChat() }, 'Chat', badge),
      h('button', { class: 'spacer', onclick: exportPDF }, 'Export PDF'),
      h('span', { title: 'Your partner enters this to link' }, 'Partner code: ', h('b', {}, flow.join_code)),
      status)
    const addRows = h('button', { class: 'addrow', onclick: () => ensureRows(rowCount + 4) }, 'Add rows')
    const root = h('div', { class: 'flowpage', onmousedown: e => { if (!picker.contains(e.target) && e.target.tagName !== 'TEXTAREA') hidePicker() } },
      bar, cases, h('div', { class: 'scroller' }, grid, addRows), panel, chatWin, picker)
    mount(root)
    const place = () => { panel.style.top = bar.offsetHeight + 'px' }
    place(); window.addEventListener('resize', place)

    function onBeforeUnload(e) {
      const dirty = anyPending() || inflight.size > 0
      flushAll()
      if (dirty) { e.preventDefault(); e.returnValue = '' }
    }
    const onHide = () => { if (document.visibilityState === 'hidden') flushAll() }
    function leave() {
      window.removeEventListener('beforeunload', onBeforeUnload)
      window.removeEventListener('pagehide', flushAll)
      document.removeEventListener('visibilitychange', onHide)
      window.removeEventListener('resize', place)
      clearInterval(tick)
      flushAll()
      Object.values(timers).forEach(clearTimeout)
      Object.values(caseTimers).forEach(clearTimeout)
      if (channel) sb.removeChannel(channel)
    }
    leaveGrid = leave
    window.addEventListener('beforeunload', onBeforeUnload)
    window.addEventListener('pagehide', flushAll)
    document.addEventListener('visibilitychange', onHide)

    ensureRows(MIN_ROWS)
    renderQs()
    updateTimers()
    tick = setInterval(updateTimers, 200)

    // ----- live sync -----
    channel = sb.channel('flow-' + flow.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'cells', filter: `flow_id=eq.${flow.id}` }, p => {
        const c = p.new
        if (!c || c.updated_by === userId) return
        ensureRows(c.row + 1)
        const key = `${c.col}:${c.row}`
        if (document.activeElement === els[key].ta) return // don't yank the cell you're typing in
        setCell(key, c.text, c.marks || [])
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `flow_id=eq.${flow.id}` }, p => addMsg(p.new, true))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'questions', filter: `flow_id=eq.${flow.id}` }, p => {
        if (p.new && p.new.id) { questions.set(p.new.id, p.new); renderQs() }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'questions' }, p => {
        if (p.old && questions.delete(p.old.id)) renderQs()
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'flows', filter: `id=eq.${flow.id}` }, p => {
        const n = p.new
        if (!n) return
        for (const side of ['aff', 'neg']) {
          const v = n[side + '_text'], ta = caseTA[side]
          if (typeof v === 'string' && v !== ta.value && document.activeElement !== ta && !casePend[side]) { ta.value = v; backupCase(side) }
        }
        if (typeof n.title === 'string' && n.title !== flow.title && document.activeElement !== titleEl) {
          flow.title = n.title; titleEl.value = n.title; sizeTitle()
        }
      })
      .on('broadcast', { event: 'timer' }, ({ payload }) => applyTimer(payload))
      .on('broadcast', { event: 'timer_req' }, () => Object.keys(TIMERS).forEach(sendTimer))
      .subscribe(s => { if (s === 'SUBSCRIBED') channel.send({ type: 'broadcast', event: 'timer_req', payload: {} }) })

    const [cells, msgs, qs, cs] = await Promise.all([
      sb.from('cells').select('col,row,text,marks').eq('flow_id', flow.id),
      sb.from('messages').select('*').eq('flow_id', flow.id).order('created_at').limit(200),
      sb.from('questions').select('*').eq('flow_id', flow.id),
      sb.from('flows').select('aff_text,neg_text').eq('id', flow.id).single()
    ])
    grid.classList.remove('loading')
    if (!cs.error && cs.data) {
      caseShared = true
      for (const side of ['aff', 'neg']) {
        const remote = cs.data[side + '_text'] || '', ta = caseTA[side]
        if (!remote && ta.value) queueCase(side)
        else if (remote !== ta.value && document.activeElement !== ta) { ta.value = remote; backupCase(side) }
      }
    }
    setCaseHint()
    if (cells.error) return setStatus('error')
    const used = cells.data.reduce((m, c) => Math.max(m, c.row + 1), 0)
    ensureRows(Math.max(MIN_ROWS, used + 2))
    cells.data.forEach(c => {
      const key = `${c.col}:${c.row}`
      if (document.activeElement !== els[key].ta) setCell(key, c.text, c.marks || [])
    })
    ;(msgs.data || []).forEach(m => addMsg(m, false))
    ;(qs.data || []).forEach(q => questions.set(q.id, q))
    renderQs()
    setStatus(anyPending() ? 'saving' : 'saved')
  }
}
</script>
</body>
</html>
